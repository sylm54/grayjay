<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#121212">
<title>Checking access…</title>
<style>
:root {
    color-scheme: dark;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #121212;
}
* {
    box-sizing: border-box;
}
html,
body {
    width: 100%;
    min-height: 100%;
    margin: 0;
    background: #121212;
}
body {
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 24px;
    color: #f2f2f2;
}
.gate-status {
    width: 100%;
    max-width: 30rem;
    padding: 28px 24px;
    text-align: center;
}
.gate-spinner {
    display: block;
    width: 34px;
    height: 34px;
    margin: 0 auto 22px;
    border: 3px solid rgba(255, 255, 255, 0.18);
    border-top-color: #f2f2f2;
    border-radius: 50%;
    animation: gate-spin 0.8s linear infinite;
}
.gate-status h1 {
    margin: 0;
    font-size: clamp(1.2rem, 4vw, 1.5rem);
    font-weight: 600;
    line-height: 1.3;
}
.gate-status p {
    margin: 10px 0 0;
    color: #a9a9a9;
    font-size: 0.95rem;
    line-height: 1.55;
}
.gate-status.is-error .gate-spinner {
    display: none;
}
.gate-status.is-error h1 {
    color: #f0b5b5;
}
@keyframes gate-spin {
    to { transform: rotate(360deg); }
}
@media (prefers-reduced-motion: reduce) {
    .gate-spinner {
        animation: none;
        border-top-color: rgba(255, 255, 255, 0.18);
    }
}
</style>
<noscript><style>.gate-live { display: none; }</style></noscript>
</head>
<body>
<main id="gate-status" class="gate-status gate-live" role="status" aria-live="polite" aria-atomic="true">
    <span class="gate-spinner" aria-hidden="true"></span>
    <h1 id="gate-status-title">Checking access…</h1>
    <p id="gate-status-detail">This should only take a moment.</p>
</main>
<noscript>
    <main class="gate-status is-error" role="alert">
        <h1>JavaScript is required</h1>
        <p>Please enable JavaScript and reload this page to complete the access check.</p>
    </main>
</noscript>
<script>
(function () {
    "use strict";
    var endpoint = "https:\/\/hypnotube.com\/age-gate";
    var returnPath = "\/index.php";
    var status = document.getElementById("gate-status");
    var statusTitle = document.getElementById("gate-status-title");
    var statusDetail = document.getElementById("gate-status-detail");

    function setStatus(title, detail, isError) {
        statusTitle.textContent = title;
        statusDetail.textContent = detail;
        if (isError) {
            status.classList.add("is-error");
        } else {
            status.classList.remove("is-error");
        }
    }

    var timeZone = "";
    try {
        timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
    } catch (e) {}

    var languages = [];
    if (navigator.languages && navigator.languages.length) {
        languages = Array.prototype.slice.call(navigator.languages, 0, 5);
    } else if (navigator.language) {
        languages = [navigator.language];
    }

    function fail() {
        // Never release content on failure: no fetch/JS means no client signal,
        // and the visitor stays here rather than falling back to the requested page.
        setStatus(
            "Unable to complete the access check",
            "Please reload this page to try again.",
            true
        );
    }

    // Only invoked when the server reports the first pass as inconclusive (see
    // the age-gate controller's class doc comment). Resolves with an object to
    // merge into the second POST: either {latitude, longitude} on permission
    // grant, or {geoDeclined: true} on denial/timeout/unsupported browsers.
    function requestGeolocation(onDone) {
        if (!("geolocation" in navigator)) {
            onDone({ geoDeclined: true });
            return;
        }
        var settled = false;
        function finish(extra) {
            if (settled) { return; }
            settled = true;
            onDone(extra);
        }
        try {
            navigator.geolocation.getCurrentPosition(function (position) {
                finish({
                    latitude: position.coords.latitude,
                    longitude: position.coords.longitude
                });
            }, function () {
                finish({ geoDeclined: true }); // permission denied / position unavailable / timeout
            }, { timeout: 6000, maximumAge: 300000 });
        } catch (e) {
            finish({ geoDeclined: true });
        }
    }

    function post(extra, retriesLeft, alreadyEscalated) {
        var payload = { timeZone: timeZone, languages: languages };
        for (var key in extra) {
            if (Object.prototype.hasOwnProperty.call(extra, key)) {
                payload[key] = extra[key];
            }
        }

        var request;
        try {
            request = fetch(endpoint + "?return=" + encodeURIComponent(returnPath), {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                credentials: "same-origin",
                body: JSON.stringify(payload)
            });
        } catch (e) {
            fail();
            return;
        }

        request.then(function (response) {
            return response.json();
        }).then(function (data) {
            // Server could not establish the visitor's location from IP/locale/
            // timezone (non-residential IP) and site policy allows one geolocation
            // prompt: ask permission once, then finish with a second,
            // always-final POST. This is the only path that ever triggers a
            // browser permission prompt -- the common case never sees it.
            if (data && data.escalate === "geolocation" && !alreadyEscalated) {
                setStatus(
                    "Location check required",
                    "Your browser may ask for location permission to finish the access check.",
                    false
                );
                requestGeolocation(function (geoExtra) {
                    setStatus("Finishing access check…", "This should only take a moment.", false);
                    post(geoExtra, 1, true);
                });
                return;
            }
            window.location.replace((data && data.redirect) ? data.redirect : returnPath);
        }).catch(function () {
            if (retriesLeft > 0) {
                setTimeout(function () { post(extra, retriesLeft - 1, alreadyEscalated); }, 800);
            } else {
                fail();
            }
        });
    }

    post({}, 1, false);
})();
</script>
</body>
</html>
